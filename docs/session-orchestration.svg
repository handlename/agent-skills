<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .focal { font-size: 16px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .sub { font-size: 12px; text-anchor: middle; dominant-baseline: central; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
      .elabel { font-size: 12px; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 3; stroke-linejoin: round; }
      .legend { font-size: 12px; dominant-baseline: central; }
      .edge { fill: none; stroke: #57606a; stroke-width: 1.5; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 4 3; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="480" fill="#ffffff"/>

  <!-- edges (drawn before nodes) -->
