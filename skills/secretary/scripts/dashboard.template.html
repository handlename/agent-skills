<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secretary Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #eef0ee; --surface: #fbfcfb; --surface-2: #f1f3f1;
  --text: #111517; --muted: #464e53; --border: #b9c0c1; --accent: #0a5884;
  --warn-bg: #f4d98a; --warn-text: #573900; --run-bg: #cde4f0; --run-text: #06476b;
  --ok-bg: #d0e9d5; --ok-text: #165a2b; --bad-bg: #f4d0cb; --bad-text: #8c1b12;
  --idle-bg: #dadfe0; --idle-text: #384044;
  --tick: #7d878b;
  --font-body: "Barlow", "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
  --font-display: "Chakra Petch", "Barlow", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, "Hiragino Sans", "Noto Sans JP", monospace;
  --radius: 2px; --gap: 16px; --hover-bg: rgba(10, 88, 132, 0.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f252a; --surface: #283036; --surface-2: #303940;
    --text: #e4e8ea; --muted: #9ca8ae; --border: #4a565e; --accent: #73c6f0;
    --warn-bg: #4b3707; --warn-text: #ffd47e; --run-bg: #0e3547; --run-text: #8ad3f3;
    --ok-bg: #123b22; --ok-text: #8fe0a8; --bad-bg: #4d1a16; --bad-text: #ffa094;
    --idle-bg: #353e45; --idle-text: #c6ced3;
    --tick: #66727a;
    --hover-bg: rgba(115, 198, 240, 0.18);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f252a; --surface: #283036; --surface-2: #303940;
  --text: #e4e8ea; --muted: #9ca8ae; --border: #4a565e; --accent: #73c6f0;
  --warn-bg: #4b3707; --warn-text: #ffd47e; --run-bg: #0e3547; --run-text: #8ad3f3;
  --ok-bg: #123b22; --ok-text: #8fe0a8; --bad-bg: #4d1a16; --bad-text: #ffa094;
  --idle-bg: #353e45; --idle-text: #c6ced3;
  --tick: #66727a;
  --hover-bg: rgba(115, 198, 240, 0.18);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 var(--font-body);
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
code, .id { font-family: var(--font-mono); font-size: 0.8em; font-variant-numeric: tabular-nums; }
a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: 1px; }
h1, h2, h3, p { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }
.shell { max-width: 1120px; margin: 0 auto; padding: 16px; }
.top { display: flex; align-items: center; gap: 12px; padding: 4px 0 12px; margin: 0 0 18px; border-bottom: 2px solid var(--text); }
.top__title { flex: 1; }
.top__eyebrow { font: 500 0.68rem/1.2 var(--font-mono); letter-spacing: 0.22em; color: var(--muted); text-transform: uppercase; }
.top h1 { font: 700 1.35rem/1.15 var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; }
.top__asof { font: 500 0.72rem/1 var(--font-mono); color: var(--muted); border: 1px solid var(--border); background: var(--surface); padding: 6px 8px; }
main { display: grid; gap: 30px; }

/* hero: neutral gray; only the overdue count turns red */
.hero {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px;
}
.hero__stat { display: grid; justify-items: center; min-width: 4.5rem; }
.hero__num { font: 700 3rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.hero__cap { font: 600 0.66rem/1.2 var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.hero[data-overdue] .hero__stat:first-child .hero__num { color: var(--bad-text); }
.hero__words { display: grid; gap: 4px; min-width: 0; }
.hero__label { font: 700 1.3rem/1.1 var(--font-display); text-transform: uppercase; letter-spacing: 0.1em; }
.hero__sub { color: var(--muted); font: 500 0.82rem/1.3 var(--font-mono); }

.section-label {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  font: 700 0.9rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.16em;
}
.section-label::before { content: ""; width: 8px; height: 8px; background: var(--text); }
.section-label::after {
  content: ""; flex: 1; height: 5px; order: 3;
  background: repeating-linear-gradient(90deg, var(--tick) 0 1px, transparent 1px 8px);
}
.count { font: 600 0.72rem/1 var(--font-mono); color: var(--muted); border: 1px solid var(--border); padding: 3px 6px; }
.label { font: 600 0.64rem/1 var(--font-mono); letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; margin-right: 6px; }
.empty { color: var(--muted); font: 0.8rem/1.4 var(--font-mono); }

.dec-list { display: grid; gap: 8px; }
.dec { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: var(--radius); padding: 10px 14px; display: grid; gap: 4px; }
.dec[data-overdue] { border-left-color: var(--bad-text); }
.dec__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.dec__text { flex: 1; min-width: 12ch; font-weight: 500; }
.dec__meta { font: 400 0.74rem/1.4 var(--font-mono); color: var(--muted); }
.dec[data-overdue] .dec__meta b { color: var(--bad-text); }
.dec[data-overdue] .dec__meta b::after { content: " overdue"; font-weight: 600; }
.nodue { color: var(--muted); }
.dec__guide { font-size: 0.85rem; color: var(--muted); display: grid; gap: 4px; }
.dec__blockers { font: 400 0.76rem/1.4 var(--font-mono); color: var(--bad-text); }
.paste { font: 400 0.78rem/1.45 var(--font-mono); background: var(--surface-2); border: 1px solid var(--border); padding: 6px 8px; white-space: pre-wrap; }
.paste:hover { background: var(--hover-bg); }

.badge { display: inline-block; border-radius: 1px; padding: 1px 6px; font: 600 0.66rem/1.35 var(--font-mono); letter-spacing: 0.04em; background: var(--idle-bg); color: var(--idle-text); white-space: nowrap; }
.badge[data-relay="awaiting_user"], .badge[data-relay="stale"] { background: var(--warn-bg); color: var(--warn-text); }
.badge[data-relay="pending"], .badge[data-relay="sent"] { background: var(--run-bg); color: var(--run-text); }
.badge[data-relay="unconfirmed"], .badge[data-relay="failed"] { background: var(--bad-bg); color: var(--bad-text); }

.today { display: grid; gap: 0; }
.today__group { padding: 8px 0; border-bottom: 1px dashed var(--border); display: grid; gap: 4px; }
.today__src { font: 600 0.74rem/1.2 var(--font-mono); letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
.today__items { display: grid; gap: 2px; padding-left: 1.1em; list-style: square; }

.notice { border: 1px solid var(--bad-text); background: var(--bad-bg); color: var(--bad-text); padding: 10px 12px; margin-bottom: 10px; display: grid; gap: 4px; font-size: 0.85rem; }
.requests { display: grid; gap: 4px; margin-bottom: 10px; }
.requests li { border: 1px solid var(--border); border-left: 4px solid var(--warn-text); background: var(--surface); padding: 6px 10px; font-size: 0.88rem; }
.src-list { display: grid; gap: 0; border-top: 1px solid var(--border); }
.src { padding: 8px 0; border-bottom: 1px dashed var(--border); display: grid; gap: 2px; }
.src__meta { font: 400 0.72rem/1.4 var(--font-mono); color: var(--muted); }
.src__err { font: 400 0.76rem/1.4 var(--font-mono); color: var(--bad-text); }
.foot { margin: 24px 0 8px; padding-top: 10px; border-top: 1px solid var(--border); font: 400 0.7rem/1.4 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.copyable { cursor: pointer; position: relative; }
.copyable:hover { background: var(--hover-bg); box-shadow: 0 0 0 3px var(--hover-bg); border-radius: 2px; }
.copyable:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.copyable[data-state]::after {
  content: attr(data-state); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--surface-2); color: var(--accent); text-decoration: none; font-weight: 600;
}
button.copyable { font: inherit; letter-spacing: inherit; color: inherit; text-align: inherit; margin: 0; border-radius: 0; }
.dec__head .id.copyable { background: none; border: 0; padding: 0; font-size: 0.8em; font-family: var(--font-mono); font-weight: 600; }
.dec__head .id.copyable:hover { background: var(--hover-bg); }
button.paste.copyable { font: 400 0.78rem/1.45 var(--font-mono); }

@keyframes sec-enter { from { opacity: 0; transform: translateY(6px); } }
.hero, .dec { animation: sec-enter 420ms cubic-bezier(.2,.7,.2,1) both; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 560px) {
  .shell { padding: 12px 16px; }
  .top { flex-wrap: wrap; row-gap: 6px; }
  .top h1 { font-size: 1.1rem; }
  .top__asof { flex-basis: 100%; padding: 4px 6px; font-size: 0.66rem; }
  .hero { padding: 14px 12px; }
  .hero__num { font-size: 2.4rem; }
}
</style>
</head>
<body>
<div class="shell">
<header class="top">
<div class="top__title"><p class="top__eyebrow">Secretary</p><h1>Dashboard</h1></div>
<p class="top__asof" data-asof></p>
</header>
<main>
{{HERO}}
{{DECISIONS}}
{{TODAY}}
{{SOURCES}}
</main>
{{FOOTER}}
</div>
<script>
// The page is a snapshot republished on visible changes; relative times and overdue marks are recomputed at view time
// and anchored by "as of rev N", read from the footer so the hashed body stays stable.
(function () {
  var foot = document.querySelector("footer[data-rev]");
  var asof = document.querySelector("[data-asof]");
  var now = new Date();
  function rel(iso) {
    var s = Math.round((now - new Date(iso)) / 1000);
    if (isNaN(s) || s < 0) return null;
    if (s < 60) return "just now";
    var m = Math.round(s / 60); if (m < 60) return m + "m ago";
    var h = Math.floor(m / 60); if (h < 24) return h + "h " + (m % 60) + "m ago";
    return Math.floor(h / 24) + "d ago";
  }
  document.querySelectorAll("time.rel").forEach(function (t) { var r = rel(t.dateTime); if (r) t.textContent = r; });
  var overdue = 0;
  document.querySelectorAll("[data-due]").forEach(function (row) {
    var due = new Date(row.dataset.due);
    if (isNaN(due)) return;
    if (due < now) { row.setAttribute("data-overdue", ""); overdue++; }
    else row.removeAttribute("data-overdue");
  });
  var hero = document.querySelector(".hero");
  var count = document.querySelector("[data-overdue-count]");
  if (count) count.textContent = overdue;
  if (hero) { if (overdue) hero.setAttribute("data-overdue", overdue); else hero.removeAttribute("data-overdue"); }
  var upd = foot && foot.querySelector("time");
  if (asof && foot && upd) asof.textContent = "as of rev " + foot.dataset.rev + " · " + upd.textContent;
})();
// Click-to-copy: copy the text of the clicked [data-copy] element (decision ID or paste text); if the clipboard is refused (e.g. inside the artifact frame), select it for a manual copy.
function copyFrom(el) {
  function flash(text) {
    el.dataset.state = text;
    setTimeout(function () { delete el.dataset.state; }, 1500);
  }
  function select() {
    var range = document.createRange();
    range.selectNodeContents(el);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    flash("Selected");
  }
  try {
    navigator.clipboard.writeText(el.textContent).then(function () { flash("Copied"); }, select);
  } catch (err) {
    select();
  }
}
document.addEventListener("click", function (e) {
  var el = e.target.closest && e.target.closest("[data-copy]");
  if (!el) return;
  var sel = window.getSelection();
  if (el.tagName !== "BUTTON" && sel && !sel.isCollapsed && el.contains(sel.anchorNode)) return;
  copyFrom(el);
});
document.addEventListener("keydown", function (e) {
  var el = e.target.closest && e.target.closest("[data-copy]");
  if (!el || el.tagName === "BUTTON" || (e.key !== "Enter" && e.key !== " ")) return;
  e.preventDefault();
  copyFrom(el);
});
</script>
</body>
</html>
