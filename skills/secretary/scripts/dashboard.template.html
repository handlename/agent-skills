<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secretary Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=Zen+Kurenaido&display=swap">
<style>
/* Layout: the secretary's phone-message pad on a gray desk. Each decision is a torn-off slip with printed form
   labels and handwritten entries; rubber stamps carry state (red OVERDUE, blue relayed, amber paste pending).
   --ink / --print / --red are for text on paper, --g-* for text printed straight on the desk. */
:root {
  --ground: oklch(0.88 0.003 80); --paper: oklch(0.985 0.004 95); --paper-2: oklch(0.95 0.004 95);
  --ink: oklch(0.23 0.012 265); --ink-soft: oklch(0.43 0.012 265); --print: oklch(0.47 0.025 255); --rule: oklch(0.80 0.02 255);
  --g-ink: oklch(0.23 0.012 265); --g-soft: oklch(0.43 0.012 265); --g-print: oklch(0.47 0.025 255); --g-red: oklch(0.50 0.18 27);
  --red: oklch(0.50 0.18 27); --blue: oklch(0.42 0.11 255); --amber: oklch(0.50 0.11 70); --link: oklch(0.38 0.09 255);
  --hover-bg: oklch(0.42 0.11 255 / 0.12); --shadow: oklch(0.2 0.01 260 / 0.22);
  --font-hand: "Zen Kurenaido", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-print: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  --font-mono: "Courier Prime", ui-monospace, Menlo, "Hiragino Sans", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: oklch(0.29 0.006 80); --paper: oklch(0.86 0.005 95); --paper-2: oklch(0.82 0.005 95); --rule: oklch(0.72 0.02 255);
    --g-ink: oklch(0.92 0.005 95); --g-soft: oklch(0.76 0.01 250); --g-print: oklch(0.78 0.03 255); --g-red: oklch(0.72 0.15 25);
    --hover-bg: oklch(0.42 0.11 255 / 0.18); --shadow: oklch(0 0 0 / 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: oklch(0.29 0.006 80); --paper: oklch(0.86 0.005 95); --paper-2: oklch(0.82 0.005 95); --rule: oklch(0.72 0.02 255);
  --g-ink: oklch(0.92 0.005 95); --g-soft: oklch(0.76 0.01 250); --g-print: oklch(0.78 0.03 255); --g-red: oklch(0.72 0.15 25);
  --hover-bg: oklch(0.42 0.11 255 / 0.18); --shadow: oklch(0 0 0 / 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground); color: var(--g-ink);
  font: 400 15px/1.6 var(--font-print);
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
code, .id { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
code { font-size: 0.85em; }
a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 1px; }
h1, h2, h3, p { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }
.shell { max-width: 1120px; margin: 0 auto; padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 4px 0 12px; margin-bottom: 20px; border-bottom: 1px solid var(--g-print); }
.top__title { flex: 1; display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.top__eyebrow { font: 700 0.72rem/1.2 var(--font-print); letter-spacing: 0.3em; text-transform: uppercase; color: var(--g-print); }
.top h1 { font: 400 1.4rem/1.2 var(--font-hand); }
.top__asof { font: 400 0.75rem/1.2 var(--font-mono); color: var(--g-soft); }
/* The last row takes the side column's extra height, so Your tasks and Decisions stay stacked without a gap. */
main { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr) minmax(240px, 300px); grid-template-areas: "hero hero" "tasks side" "dec side"; grid-template-rows: auto auto 1fr; column-gap: 28px; align-items: start; }
main[data-no-tasks] { grid-template-areas: "hero hero" "dec side"; grid-template-rows: auto 1fr; }
main > * { min-width: 0; }
.hero { grid-area: hero; }
.your-tasks { grid-area: tasks; }
.decisions { grid-area: dec; }
.side { grid-area: side; display: grid; gap: 28px; min-width: 0; }

.section-label { display: flex; align-items: baseline; gap: 8px; font: 700 0.8rem/1.2 var(--font-print); letter-spacing: 0.2em; text-transform: uppercase; color: var(--print); padding-bottom: 6px; margin-bottom: 14px; border-bottom: 3px double var(--print); }
.decisions > .section-label, .your-tasks > .section-label { color: var(--g-print); border-bottom-color: var(--g-print); }
.count { font: 700 0.8rem/1 var(--font-mono); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.label { display: block; font-size: 0.78rem; color: var(--ink-soft); }
.empty { color: var(--g-soft); font-family: var(--font-hand); font-size: 1.05rem; }
.today .empty, .sources .empty { color: var(--ink-soft); }

/* hero: printed straight on the desk; only the overdue count turns red */
.hero { display: flex; flex-wrap: wrap; align-items: end; gap: 6px 28px; padding-bottom: 14px; border-bottom: 1px solid var(--g-print); }
.hero__stat { display: grid; }
.hero__num { font: 400 3rem/1 var(--font-hand); font-variant-numeric: tabular-nums; }
.hero__cap { font: 700 0.7rem/1.4 var(--font-print); letter-spacing: 0.16em; text-transform: uppercase; color: var(--g-print); }
.hero[data-overdue] .hero__stat:first-child .hero__num { color: var(--g-red); }
.hero__words { flex: 1; min-width: 14rem; display: grid; gap: 2px; }
.hero__label { font: 700 1.4rem/1.2 var(--font-print); letter-spacing: 0.04em; }
.hero__sub { color: var(--g-soft); font: 400 1.05rem/1.4 var(--font-hand); }

/* decisions: message slips with a perforated top edge */
.dec-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.dec {
  position: relative; display: grid; gap: 10px; align-content: start;
  background: var(--paper); color: var(--ink); padding: 22px 18px 16px;
  box-shadow: 0 1px 2px var(--shadow), 0 8px 12px -10px var(--shadow);
  background-image: radial-gradient(circle at 5px -1px, var(--ground) 3px, transparent 3.5px); background-size: 10px 8px; background-repeat: repeat-x;
}
.dec::before { content: "MESSAGE"; font: 700 0.68rem/1 var(--font-print); letter-spacing: 0.3em; color: var(--print); }
.dec__head { display: grid; gap: 4px; }
.dec__head .id { position: absolute; top: 18px; right: 16px; font: 700 0.78rem/1 var(--font-mono); color: var(--print); }
.dec__head .id::before { content: "No. "; font-weight: 400; }
.dec__text { font: 400 1.15rem/2rem var(--font-hand); background-image: repeating-linear-gradient(to bottom, transparent 0 calc(2rem - 1px), var(--rule) calc(2rem - 1px) 2rem); }
.dec__meta { font: 500 0.8rem/1.6 var(--font-print); color: var(--print); }
.dec__meta b, .dec__src { font: 400 1rem/1 var(--font-hand); color: var(--ink); }
.dec__src::before { content: "From "; font: 700 0.7rem/1 var(--font-print); letter-spacing: 0.12em; color: var(--print); }
.dec[data-overdue] .dec__meta b { color: var(--red); }
.dec[data-overdue] .dec__meta b::after { content: " overdue"; }
.dec[data-overdue] .dec__head { padding-right: 92px; }
.dec[data-overdue]::after {
  content: "OVERDUE"; position: absolute; right: 14px; top: 40px; pointer-events: none;
  font: 700 0.8rem/1 var(--font-print); letter-spacing: 0.12em; color: var(--red);
  border: 2.5px solid var(--red); border-radius: 50%; padding: 14px 8px; rotate: -14deg; opacity: 0.82;
}
.nodue { color: var(--ink-soft); font-family: var(--font-print); font-size: 0.8rem; }
.dec__guide { font-size: 0.8rem; color: var(--ink-soft); display: grid; gap: 4px; border-top: 1px solid var(--rule); padding-top: 8px; }
.dec__blockers { font: 400 0.76rem/1.45 var(--font-mono); color: var(--red); }
.paste { font: 400 0.76rem/1.45 var(--font-mono); background: var(--paper-2); color: var(--ink); padding: 6px 8px; white-space: pre-wrap; }
.paste:hover { background: var(--hover-bg); }

/* your tasks: one to-do sheet from the same pad; only an overdue due date turns red */
.task-list { background: var(--paper); color: var(--ink); padding: 6px 16px 10px; box-shadow: 0 1px 2px var(--shadow); }
.task { display: grid; gap: 6px; padding: 12px 0 12px 1.6em; border-bottom: 1px solid var(--rule); position: relative; }
.task:last-child { border-bottom: 0; }
.task::before { content: ""; position: absolute; left: 0; top: 1.05em; width: 0.9em; height: 0.9em; border: 1.5px solid var(--print); }
.task__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.task__head .id { font: 700 0.78rem/1 var(--font-mono); color: var(--print); }
.task__text { flex: 1 1 14rem; font: 400 1.1rem/1.5 var(--font-hand); }
.task__meta { font: 500 0.8rem/1.6 var(--font-print); color: var(--print); }
.task__meta b { font: 400 1rem/1 var(--font-hand); color: var(--ink); }
.task[data-overdue] .task__meta b { color: var(--red); }
.task[data-overdue] .task__meta b::after { content: " overdue"; }
.task__hint { font-size: 0.78rem; color: var(--ink-soft); }
.task__done { font-size: 0.8rem; color: var(--ink-soft); display: grid; gap: 4px; }

/* rubber stamps */
.badge {
  justify-self: start; display: inline-block; white-space: nowrap;
  font: 700 0.72rem/1.2 var(--font-print); letter-spacing: 0.08em; text-transform: uppercase;
  padding: 3px 8px; border: 2px solid currentColor; border-radius: 3px; rotate: -4deg; opacity: 0.88; color: var(--ink-soft);
}
.badge[data-relay="awaiting_user"], .badge[data-relay="stale"] { color: var(--amber); }
.badge[data-relay="pending"], .badge[data-relay="sent"] { color: var(--blue); }
.badge[data-relay="unconfirmed"], .badge[data-relay="failed"] { color: var(--red); }

/* today and sources: plain sheets from the same pad */
.today, .sources { background: var(--paper); color: var(--ink); padding: 16px 16px 18px; box-shadow: 0 1px 2px var(--shadow); }
.today { display: grid; }
.today__group { display: grid; gap: 2px; padding-bottom: 10px; }
.today__src { font: 700 0.7rem/1.6 var(--font-print); letter-spacing: 0.16em; text-transform: uppercase; color: var(--print); }
.today__items li { font: 400 1.02rem/1.6 var(--font-hand); padding: 4px 0 4px 1.4em; border-bottom: 1px solid var(--rule); position: relative; }
.today__items li::before { content: ""; position: absolute; left: 0; top: 0.75em; width: 0.8em; height: 0.8em; border: 1.5px solid var(--print); }

.notice { border: 2px solid var(--red); color: var(--red); padding: 8px 10px; margin-bottom: 10px; display: grid; gap: 4px; font-size: 0.85rem; }
.requests { display: grid; gap: 4px; margin-bottom: 10px; }
.requests li { border-left: 3px solid var(--amber); background: var(--paper-2); padding: 6px 10px; font-size: 0.85rem; }
.src-list { display: grid; }
.src { padding: 8px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 2px; font-size: 0.85rem; }
.src .badge { font-size: 0.62rem; rotate: 0deg; padding: 1px 5px; border-width: 1.5px; }
.src__meta { font: 400 0.75rem/1.5 var(--font-mono); color: var(--ink-soft); }
.src__err { font: 400 0.75rem/1.5 var(--font-mono); color: var(--red); }
.foot { margin: 24px 0 8px; padding-top: 10px; border-top: 1px solid var(--g-print); font: 400 0.72rem/1.4 var(--font-mono); color: var(--g-soft); }

.copyable { cursor: pointer; position: relative; }
.copyable:hover { background: var(--hover-bg); box-shadow: 0 0 0 3px var(--hover-bg); border-radius: 2px; }
.copyable:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.copyable[data-state]::after {
  content: attr(data-state); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--paper-2); color: var(--blue); font: 700 0.8rem/1 var(--font-print);
}
button.copyable { font: inherit; letter-spacing: inherit; color: inherit; text-align: inherit; background: none; border: 0; padding: 0; margin: 0; }
button.paste.copyable { font: 400 0.76rem/1.45 var(--font-mono); background: var(--paper-2); padding: 6px 8px; }
.dec__head .id.copyable, .task__head .id.copyable { font: 700 0.78rem/1 var(--font-mono); }

@media (max-width: 760px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "hero" "tasks" "dec" "side"; grid-template-rows: none; }
  main[data-no-tasks] { grid-template-areas: "hero" "dec" "side"; grid-template-rows: none; }
}
@media (max-width: 560px) {
  .hero__num { font-size: 2.4rem; }
  .top__asof { flex-basis: 100%; }
  .dec-list { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div class="shell">
<header class="top">
<div class="top__title"><p class="top__eyebrow">Secretary</p><h1>Dashboard</h1></div>
<p class="top__asof" data-asof></p>
</header>
<main{{MAIN_ATTRS}}>
{{HERO}}
{{YOUR_TASKS}}
{{DECISIONS}}
<div class="side">
{{TODAY}}
{{SOURCES}}
</div>
</main>
{{FOOTER}}
</div>
<script>
// The page is a snapshot republished on visible changes; relative times and overdue marks are recomputed at view time
// and anchored by "as of rev N", read from the footer so the hashed body stays stable.
(function () {
  var foot = document.querySelector("footer[data-rev]");
  var asof = document.querySelector("[data-asof]");
  var now = new Date();
  function rel(iso) {
    var s = Math.round((now - new Date(iso)) / 1000);
    if (isNaN(s) || s < 0) return null;
    if (s < 60) return "just now";
    var m = Math.round(s / 60); if (m < 60) return m + "m ago";
    var h = Math.floor(m / 60); if (h < 24) return h + "h " + (m % 60) + "m ago";
    return Math.floor(h / 24) + "d ago";
  }
  document.querySelectorAll("time.rel").forEach(function (t) { var r = rel(t.dateTime); if (r) t.textContent = r; });
  var overdue = 0;
  document.querySelectorAll("[data-due]").forEach(function (row) {
    var due = new Date(row.dataset.due);
    if (isNaN(due)) return;
    if (due < now) { row.setAttribute("data-overdue", ""); overdue++; }
    else row.removeAttribute("data-overdue");
  });
  var hero = document.querySelector(".hero");
  var count = document.querySelector("[data-overdue-count]");
  if (count) count.textContent = overdue;
  if (hero) { if (overdue) hero.setAttribute("data-overdue", overdue); else hero.removeAttribute("data-overdue"); }
  var upd = foot && foot.querySelector("time");
  if (asof && foot && upd) asof.textContent = "as of rev " + foot.dataset.rev + " · " + upd.textContent;
})();
// Click-to-copy: copy the text of the clicked [data-copy] element (decision ID or paste text); if the clipboard is refused (e.g. inside the artifact frame), select it for a manual copy.
function copyFrom(el) {
  function flash(text) {
    el.dataset.state = text;
    setTimeout(function () { delete el.dataset.state; }, 1500);
  }
  function select() {
    var range = document.createRange();
    range.selectNodeContents(el);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    flash("Selected");
  }
  try {
    navigator.clipboard.writeText(el.textContent).then(function () { flash("Copied"); }, select);
  } catch (err) {
    select();
  }
}
document.addEventListener("click", function (e) {
  var el = e.target.closest && e.target.closest("[data-copy]");
  if (!el) return;
  var sel = window.getSelection();
  if (el.tagName !== "BUTTON" && sel && !sel.isCollapsed && el.contains(sel.anchorNode)) return;
  copyFrom(el);
});
document.addEventListener("keydown", function (e) {
  var el = e.target.closest && e.target.closest("[data-copy]");
  if (!el || el.tagName === "BUTTON" || (e.key !== "Enter" && e.key !== " ")) return;
  e.preventDefault();
  copyFrom(el);
});
</script>
</body>
</html>
