<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supervisor Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 var(--font-body);
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
code, .id { font-family: var(--font-mono); font-size: 0.85em; }
a { color: var(--accent); }
h1, h2, h3, p { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }
.shell { max-width: 1120px; margin: 0 auto; padding: 16px; }
.top { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 16px; position: relative; }
.top__title { flex: 1; }
.top__eyebrow { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.top h1 { font: 700 1.4rem/1.2 var(--font-display); }
.top__asof { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
main { display: grid; gap: calc(var(--gap) * 1.5); }

.act { background: var(--surface); color: var(--text); border-radius: calc(var(--radius) - 2px); padding: 10px 12px; display: grid; gap: 2px; }
.act__kind { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.act__meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.8rem; color: var(--muted); }

.section-label { font: 700 1rem/1.3 var(--font-display); margin-bottom: 10px; display: flex; gap: 8px; align-items: baseline; }
.count { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.project-list { display: grid; gap: 20px; }
.project { display: grid; gap: 10px; }
.project__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.project__title { font: 700 1rem/1.3 var(--font-display); }
.project__meta { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.task-list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); }
.task { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; align-content: start; }
.task__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; }
.task__id { color: var(--muted); }
.task__title { font: 650 1rem/1.3 var(--font-display); flex: 1; min-width: 10ch; }
.task__cancel { font-size: 0.85rem; color: var(--muted); }
.task__progress { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.task__segments { display: flex; gap: 3px; height: 8px; grid-column: 1 / -1; }
.seg { flex: 1; border-radius: 2px; background: var(--seg-track); }
.seg[data-state="done"] { background: var(--ok-text); }
.seg[data-state="running"] { background: var(--run-text); }
.seg[data-state="needs_input"], .seg[data-state="missing"], .seg[data-state="external"] { background: var(--attention); }
.seg[data-state="idle"] { background: var(--idle-text); }
.task__progress-label, .task__elapsed { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.task__elapsed { text-align: right; }
.task__next { font-size: 0.9rem; }
.label { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.task__workers { display: grid; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; }
.wk { display: flex; gap: 8px; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--seg-track); }
.dot[data-state="done"] { background: var(--ok-text); }
.dot[data-state="running"] { background: var(--run-text); }
.dot[data-state="needs_input"], .dot[data-state="missing"], .dot[data-state="external"] { background: var(--attention); }
.dot[data-state="idle"] { background: var(--idle-text); }
.wk__body { min-width: 0; display: grid; gap: 2px; }
.wk__title { font-size: 0.9rem; }
.wk__meta, .wk__report { font-size: 0.8rem; color: var(--muted); }
.wk__report[data-report="unparsed"] { color: var(--warn-text); }
.wk__rs { font-family: var(--font-mono); font-size: 0.9em; }
.artifacts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.8rem; }

.arc-list { display: grid; gap: 6px; }
.arc { display: grid; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.arc__meta { font-size: 0.8rem; color: var(--muted); }
.arc__reason, .arc__note { font-size: 0.85rem; color: var(--muted); }
.empty { color: var(--muted); font-size: 0.9rem; }
.foot { margin: 24px 0 8px; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.chip { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; background: var(--idle-bg); color: var(--idle-text); font-family: var(--font-body); }
.chip[data-state="needs_user"], .chip[data-state="needs_input"], .chip[data-state="missing"] { background: var(--warn-bg); color: var(--warn-text); }
.chip[data-state="running"] { background: var(--run-bg); color: var(--run-text); }
.chip[data-state="done"], .chip[data-state="archived"] { background: var(--ok-bg); color: var(--ok-text); }
.chip[data-state="cancelled"] { background: var(--bad-bg); color: var(--bad-text); }

/* motion: one-shot entrance only */
@keyframes sv-enter { from { opacity: 0; transform: translateY(6px); } }
.task { animation: sv-enter 420ms cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 50ms); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

:root {
  --bg: #eef0ee; --surface: #fbfcfb; --surface-2: #f1f3f1;
  --text: #111517; --muted: #464e53; --border: #b9c0c1; --accent: #0a5884;
  --warn-bg: #f4d98a; --warn-text: #573900; --run-bg: #cde4f0; --run-text: #06476b;
  --ok-bg: #d0e9d5; --ok-text: #165a2b; --bad-bg: #f4d0cb; --bad-text: #8c1b12;
  --idle-bg: #dadfe0; --idle-text: #384044;
  --attention: #9a6200;
  --seg-track: #d3d8d8;
  /* light: --glass is a daylight panel face; dark mode keeps a dark glass */
  --glass: #e2e5e4;
  --lamp: #8a5300; --advisory: #0a5884;
  --bracket: #2b3337; --tick: #7d878b;
  --font-body: "Barlow", "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
  --font-display: "Chakra Petch", "Barlow", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, "Hiragino Sans", "Noto Sans JP", monospace;
  --radius: 2px; --gap: 16px; --hover-bg: rgba(10, 88, 132, 0.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f252a; --surface: #283036; --surface-2: #303940;
    --text: #e4e8ea; --muted: #9ca8ae; --border: #4a565e; --accent: #73c6f0;
    --warn-bg: #4b3707; --warn-text: #ffd47e; --run-bg: #0e3547; --run-text: #8ad3f3;
    --ok-bg: #123b22; --ok-text: #8fe0a8; --bad-bg: #4d1a16; --bad-text: #ffa094;
    --idle-bg: #353e45; --idle-text: #c6ced3;
    --attention: #f0aa22;
    --seg-track: #3b454c;
    --glass: #0a0c0d;
    --lamp: #ffc53d; --advisory: #5fc6e8;
    --bracket: #8e9aa1; --tick: #66727a;
    --hover-bg: rgba(115, 198, 240, 0.18);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f252a; --surface: #283036; --surface-2: #303940;
  --text: #e4e8ea; --muted: #9ca8ae; --border: #4a565e; --accent: #73c6f0;
  --warn-bg: #4b3707; --warn-text: #ffd47e; --run-bg: #0e3547; --run-text: #8ad3f3;
  --ok-bg: #123b22; --ok-text: #8fe0a8; --bad-bg: #4d1a16; --bad-text: #ffa094;
  --idle-bg: #353e45; --idle-text: #c6ced3;
  --attention: #f0aa22;
  --seg-track: #3b454c;
  --glass: #0a0c0d;
  --lamp: #ffc53d; --advisory: #5fc6e8;
  --bracket: #8e9aa1; --tick: #66727a;
  --hover-bg: rgba(115, 198, 240, 0.18);
  color-scheme: dark;
}

/* ---- console frame ---- */
body { font-size: 15px; letter-spacing: 0.005em; }
code,
.id { font-size: 0.8em; font-variant-numeric: tabular-nums; }
a { text-underline-offset: 2px; text-decoration-thickness: 1px; }

.top {
  align-items: center; gap: 12px; padding: 4px 0 12px; margin: 0 0 18px;
  border-bottom: 2px solid var(--text);
}
.top::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 4px;
  background: repeating-linear-gradient(90deg, var(--tick) 0 1px, transparent 1px 12px);
}
.sig {
  flex: none; width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid var(--text);
  background:
    radial-gradient(circle, var(--attention) 0 2.5px, transparent 3px),
    linear-gradient(var(--text), var(--text)) center / 2px 100% no-repeat,
    linear-gradient(var(--text), var(--text)) center / 100% 2px no-repeat;
}
.top__eyebrow {
  font: 500 0.68rem/1.2 var(--font-mono); letter-spacing: 0.22em; color: var(--muted);
}
.top h1 {
  font: 700 1.35rem/1.15 var(--font-display); text-transform: uppercase; letter-spacing: 0.06em;
}
.top__asof {
  font: 500 0.72rem/1 var(--font-mono); letter-spacing: 0.04em; color: var(--muted);
  border: 1px solid var(--border); background: var(--surface); padding: 6px 8px;
}

.task__attention-list { display: grid; gap: 6px; margin-top: 6px; }
.act {
  background: var(--surface-2); color: var(--text); border-radius: 1px;
  padding: 9px 12px 9px 14px; border-left: 4px solid var(--lamp);
  grid-template-columns: 5.5rem minmax(0, 1fr); grid-template-areas: "kind text" "kind meta"; column-gap: 12px;
}
.act[data-kind="external"] { border-left-color: var(--advisory); }
.act__kind {
  grid-area: kind; align-self: start; padding-top: 3px;
  font: 600 0.66rem/1.2 var(--font-mono); letter-spacing: 0.18em; color: var(--lamp);
}
.act[data-kind="worker"] .act__kind { color: var(--muted); }
.act[data-kind="external"] .act__kind { color: var(--advisory); }
.act__text { grid-area: text; font-weight: 500; }
.act__meta {
  grid-area: meta; color: var(--muted); font: 400 0.74rem/1.4 var(--font-mono); gap: 2px 14px;
}
.act__text code { overflow-wrap: anywhere; }
.md > * + * { margin-top: 6px; }
.md ul, .md ol { margin: 0; padding-left: 1.4em; }
.md ul { list-style: disc; }
.md ol { list-style: decimal; }
.md li + li { margin-top: 2px; }
.md code { padding: 0 3px; border-radius: 2px; background: var(--glass); }
.md strong { font-weight: 700; }

/* ---- section placards ---- */
main { gap: 30px; }
.section-label {
  align-items: center; gap: 10px; margin-bottom: 12px;
  font: 700 0.9rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.16em;
}
.section-label::before { content: ""; width: 8px; height: 8px; background: var(--text); }
.section-label::after {
  content: ""; flex: 1; height: 5px; order: 3;
  background: repeating-linear-gradient(90deg, var(--tick) 0 1px, transparent 1px 8px);
}
.count {
  font: 600 0.72rem/1 var(--font-mono); letter-spacing: 0.04em; color: var(--muted);
  border: 1px solid var(--border); padding: 3px 6px;
}

/* ---- station panels ---- */
.task-list { gap: 14px; }
.task {
  --b: var(--bracket);
  border-radius: var(--radius); padding: 14px 16px; gap: 12px;
  background:
    linear-gradient(var(--b), var(--b)) left top / 14px 2px no-repeat,
    linear-gradient(var(--b), var(--b)) left top / 2px 14px no-repeat,
    linear-gradient(var(--b), var(--b)) right top / 14px 2px no-repeat,
    linear-gradient(var(--b), var(--b)) right top / 2px 14px no-repeat,
    linear-gradient(var(--b), var(--b)) left bottom / 14px 2px no-repeat,
    linear-gradient(var(--b), var(--b)) left bottom / 2px 14px no-repeat,
    linear-gradient(var(--b), var(--b)) right bottom / 14px 2px no-repeat,
    linear-gradient(var(--b), var(--b)) right bottom / 2px 14px no-repeat,
    var(--surface);
}
.task[data-status="needs_user"] { --b: var(--attention); }
.task[data-status="running"] { --b: var(--run-text); }
.task[data-cancelled] { --b: var(--bad-text); }
.task__head { align-items: center; }
.task__id {
  color: var(--text); background: var(--surface-2); border: 1px solid var(--border);
  padding: 1px 6px; font-weight: 600; letter-spacing: 0.04em; font-family: var(--font-mono);
}
.task__title { font: 600 1.02rem/1.25 var(--font-display); letter-spacing: 0.01em; }

.task__progress { gap: 6px 12px; }
.task__segments {
  gap: 2px; height: 16px; padding-bottom: 6px;
  background: repeating-linear-gradient(90deg, var(--tick) 0 1px, transparent 1px 10px) left bottom / 100% 4px no-repeat;
}
.seg { border-radius: 0; }
.seg[data-state="done"] {
  background: linear-gradient(var(--surface), var(--surface)) center / 2px 4px no-repeat, var(--ok-text);
}
.task__progress-label,
.task__elapsed { font: 500 0.74rem/1.3 var(--font-mono); letter-spacing: 0.03em; }
.task__progress-label b { font: 700 1.05rem/1 var(--font-display); color: var(--text); }
.task__progress:has(.seg[data-state="done"]) .task__progress-label b { color: var(--ok-text); }
.task__progress:has(.seg[data-state="done"]):has(.seg:not([data-state="done"])) .task__progress-label::after {
  content: "PARTIAL"; margin-left: 8px; padding: 1px 5px; font-size: 0.62rem; letter-spacing: 0.16em;
  background: var(--ok-bg); color: var(--ok-text);
}
.task__next { font-size: 0.9rem; }
.label {
  font: 600 0.64rem/1 var(--font-mono); letter-spacing: 0.18em; color: var(--muted); margin-right: 6px;
}
.label::after { content: " ›"; }
.task__cancel { font-size: 0.85rem; }

.task__workers { gap: 10px; border-top: 1px solid var(--border); padding-top: 12px; }
.wk { gap: 10px; }
.dot {
  width: 10px; height: 10px; border-radius: 1px; margin-top: 5px;
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--border);
}
.wk__title { font-weight: 500; }
.wk__meta { font: 400 0.72rem/1.45 var(--font-mono); }
.wk__meta code { font-size: 1em; }
.wk__report { font: 400 0.76rem/1.45 var(--font-mono); }
.copyable { cursor: pointer; position: relative; }
.copyable:hover { background: var(--hover-bg); box-shadow: 0 0 0 3px var(--hover-bg); border-radius: 2px; }
.copyable:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.copyable[data-state]::after {
  content: attr(data-state); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--surface-2); color: var(--accent); text-decoration: none; font-weight: 600;
}
button.copyable { font: inherit; letter-spacing: inherit; color: inherit; text-align: inherit; margin: 0; border-radius: 0; }
.arc__title .id.copyable { background: none; border: 0; padding: 0; font-size: 0.8em; font-family: var(--font-mono); }
.arc__title .id.copyable:hover { background: var(--hover-bg); }
.wk__report::before { content: "› "; color: var(--tick); }
.wk__rs { font-size: 1em; font-weight: 600; }
.wk__rs::before { content: "["; }
.wk__rs::after { content: "]"; }

.artifacts { gap: 6px; font: 400 0.72rem/1.5 var(--font-mono); }
.artifacts li {
  border: 1px solid var(--border); border-left: 3px solid var(--tick); padding: 1px 7px; background: var(--surface-2); max-width: 100%;
}
.artifacts code { font-size: 1em; }
.artifacts-fold { border-top: 1px dashed var(--border); padding-top: 8px; }
.artifacts-fold > summary {
  cursor: pointer; list-style: none; display: flex; align-items: center; gap: 4px;
  font: 400 0.72rem/1.5 var(--font-mono); color: var(--muted);
}
.artifacts-fold > summary::-webkit-details-marker { display: none; }
.artifacts-fold > summary::before { content: "▸"; width: 1em; color: var(--tick); }
.artifacts-fold[open] > summary::before { content: "▾"; }
.artifacts-fold > summary:hover { color: var(--text); }
.artifacts-fold > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.artifacts-fold .artifacts { margin-top: 8px; }
.arc .artifacts-fold { border-top: 0; padding-top: 2px; }

/* ---- logbook ---- */
.arc-list { gap: 0; border-top: 1px solid var(--border); }
.arc { padding: 10px 0; border-bottom: 1px dashed var(--border); gap: 4px; }
.arc__meta { font: 400 0.72rem/1.4 var(--font-mono); letter-spacing: 0.03em; }
.empty { font-family: var(--font-mono); font-size: 0.8rem; }
.foot {
  font: 400 0.7rem/1.4 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase;
  padding-top: 10px; border-top: 1px solid var(--border);
}

/* ---- chips as lamp legends ---- */
.chip {
  border-radius: 1px; padding: 1px 6px; vertical-align: 1px;
  font: 600 0.66rem/1.35 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase;
}

@media (max-width: 560px) {
  .shell { padding: 12px 16px; }
  .top { margin-bottom: 14px; padding-bottom: 10px; flex-wrap: wrap; row-gap: 6px; }
  .top h1 { font-size: 1.1rem; }
  .top__asof { flex-basis: 100%; padding: 4px 6px; font-size: 0.66rem; }
  .act {
    grid-template-columns: minmax(0, 1fr); grid-template-areas: "kind" "text" "meta";
    padding: 6px 10px 7px 10px; border-left-width: 3px; row-gap: 1px;
  }
  .act__kind { padding-top: 0; font-size: 0.58rem; }
  .act__text { font-size: 0.88rem; line-height: 1.35; }
  .act__meta { font-size: 0.66rem; }
}
</style>
</head>
<body>
<div class="shell">
<header class="top">
<span class="sig" aria-hidden="true"></span>
<div class="top__title"><p class="top__eyebrow">Session Supervisor</p><h1>Dashboard</h1></div>
<p class="top__asof" data-asof></p>
</header>
<main>
{{TASKS}}
{{ARCHIVED}}
</main>
{{FOOTER}}
</div>
<script>
// The page is a snapshot republished on visible changes; relative times are computed at view time
// and anchored by "as of rev N", read from the footer so the hashed body stays stable.
(function () {
  var foot = document.querySelector("footer[data-rev]");
  var asof = document.querySelector("[data-asof]");
  var now = new Date();
  function rel(iso) {
    var s = Math.round((now - new Date(iso)) / 1000);
    if (isNaN(s)) return null;
    if (s < 60) return "just now";
    var m = Math.round(s / 60); if (m < 60) return m + "m ago";
    var h = Math.floor(m / 60); if (h < 24) return h + "h " + (m % 60) + "m ago";
    return Math.floor(h / 24) + "d ago";
  }
  document.querySelectorAll("time.rel").forEach(function (t) { var r = rel(t.dateTime); if (r) t.textContent = r; });
  var upd = foot && foot.querySelector("time");
  if (asof && foot && upd) asof.textContent = "as of rev " + foot.dataset.rev + " · " + upd.textContent;
})();
// Click-to-copy: copy the text of the clicked [data-copy] element (task ID); if the clipboard is refused (e.g. inside the artifact frame), select it for a manual copy.
function copyFrom(el) {
  function flash(text) {
    el.dataset.state = text;
    setTimeout(function () { delete el.dataset.state; }, 1500);
  }
  function select() {
    var range = document.createRange();
    range.selectNodeContents(el);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    flash("Selected");
  }
  try {
    navigator.clipboard.writeText(el.textContent).then(function () { flash("Copied"); }, select);
  } catch (err) {
    select();
  }
}
document.addEventListener("click", function (e) {
  var el = e.target.closest && e.target.closest("[data-copy]");
  if (!el) return;
  var sel = window.getSelection();
  if (el.tagName !== "BUTTON" && sel && !sel.isCollapsed && el.contains(sel.anchorNode)) return;
  copyFrom(el);
});
document.addEventListener("keydown", function (e) {
  var el = e.target.closest && e.target.closest("[data-copy]");
  if (!el || el.tagName === "BUTTON" || (e.key !== "Enter" && e.key !== " ")) return;
  e.preventDefault();
  copyFrom(el);
});
</script>
</body>
</html>
